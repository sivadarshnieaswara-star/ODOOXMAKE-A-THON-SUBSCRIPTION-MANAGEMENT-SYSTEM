[project]
name = "brightloop-subscription-management"
version = "1.0.0"
description = "Brightloop Software - Subscription Management System (Odoo x Make-A-Thon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "email-validator>=2.0.0",
    "pyjwt>=2.8.0",
    "jinja2>=3.1.3",
    "python-dateutil>=2.9.0",
    "python-multipart>=0.0.9",
    "qrcode>=7.4.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:.*starlette.*:Warning",
    "ignore:.*httpx.*:Warning",
    "ignore:.*testclient.*:Warning",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
