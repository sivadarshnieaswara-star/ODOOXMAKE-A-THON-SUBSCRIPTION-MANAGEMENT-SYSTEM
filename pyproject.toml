[project]
name = "brightloop-sms"
version = "1.0.0"
description = "Brightloop Software - Subscription Management System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "email-validator>=2.1",
    "python-dateutil>=2.9",
    "pyjwt>=2.8",
    "jinja2>=3.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
